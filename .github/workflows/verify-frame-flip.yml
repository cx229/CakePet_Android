name: Verify frame flip Kotlin compilation final
on:
  push:
    branches: [feat/261105-frame-flip]
    paths: [.github/workflows/verify-frame-flip.yml]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install API 37
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin only (no APK)
        run: bash ./gradlew --no-daemon :app:compileDebugKotlin
