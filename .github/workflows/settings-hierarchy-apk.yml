name: Settings hierarchy APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/261103-v102-mode-decoupling
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/settings-hierarchy-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 37 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'platform-tools' 'build-tools;37.0.0'
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CakePet-settings-hierarchy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
